<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            font-family: sans-serif;
        }
        #ui label, #ui input, #ui button {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <b>Point 1</b><br>
        <label for="lat1">Latitude:</label>
        <input type="number" id="lat1" placeholder="e.g., 40.71" value="40.71"><br>
        <label for="lon1">Longitude:</label>
        <input type="number" id="lon1" placeholder="e.g., -74.00" value="-74.00"><br>
        <b>Point 2</b><br>
        <label for="lat2">Latitude:</label>
        <input type="number" id="lat2" placeholder="e.g., 34.05" value="34.05"><br>
        <label for="lon2">Longitude:</label>
        <input type="number" id="lon2" placeholder="e.g., -118.24" value="-118.24"><br>
        <button id="plot-button">Plot Curve</button>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="/main.js"></script>
</body>
</html>
