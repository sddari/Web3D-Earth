<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            font-family: sans-serif;
        }
        #ui label, #ui input, #ui button {
            margin: 2px;
        }
        .point-group {
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }
        #tooltip {
            position: absolute;
            display: none;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 3px;
            padding: 5px;
            color: white;
            font-family: sans-serif;
            font-size: 12px;
            pointer-events: none; /* So it doesn't interfere with mouse events on the canvas */
        }
    </style>
</head>
<body>
    <div id="tooltip"></div>
    <div id="ui">
        <div id="points-container">
            <div class="point-group">
                <b>Point 1</b><br>
                <label>Lat:</label>
                <input type="number" class="lat-input" placeholder="e.g., 40.71" value="40.71">
                <label>Lon:</label>
                <input type="number" class="lon-input" placeholder="e.g., -74.00" value="-74.00">
            </div>
            <div class="point-group">
                <b>Point 2</b><br>
                <label>Lat:</label>
                <input type="number" class="lat-input" placeholder="e.g., 34.05" value="34.05">
                <label>Lon:</label>
                <input type="number" class="lon-input" placeholder="e.g., -118.24" value="-118.24">
            </div>
        </div>
        <button id="add-point-button">Add Point</button>
        <hr>
        <button id="plot-route-button">Plot Route</button>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="/main.js"></script>
</body>
</html>
